name: Publish PTO website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pto-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare empty content folders
        run: mkdir -p content/events content/news public/assets/uploads
      - name: Validate content and security tests
        run: npm test
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website
        run: npm run build && npm run check
        env:
          CMS_OAUTH_ORIGIN: ${{ vars.CMS_OAUTH_ORIGIN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
